      responses:
        '204':
          description: No response body
  /login/:
    post:
      operationId: login_create
      description: Autentica usuario com username e password e retorna token de acesso
        da API.
      tags:
      - login
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              RequestDeLogin:
                value:
                  username: admin
                  password: senha123
                summary: Request de login
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                RespostaDeSucesso:
                  value:
                    token: abc123def456ghi789
                    id: 1
                  summary: Resposta de sucesso
          description: Autenticacao realizada com sucesso.
        '400':
          description: Credenciais invalidas.
  /users/:
    post:
      operationId: users_create
      description: Cria um novo usuario para autenticacao na API e gera token automaticamente.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /users/{id}/:
    get:
      operationId: users_retrieve
      description: Recupera os dados publicos de um usuario pelo ID.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
