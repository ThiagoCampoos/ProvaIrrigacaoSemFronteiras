          type: boolean
          title: Cirurgia
          description: Indica necessidade de cirurgia.
        exams:
          type: boolean
          title: Exames
          description: Indica necessidade de exames.
        appointment:
          type: boolean
          title: Consultas
          description: Indica necessidade de consulta.
        other:
          type: boolean
          title: Outros
          description: Outras necessidades de atendimento.
        ca_number:
          type: string
          nullable: true
          title: Número C.A.
          description: Numero C.A. quando aplicavel.
          maxLength: 20
        social_vacancy:
          type: boolean
          nullable: true
          title: Vaga Social?
          description: Indica se ocupa vaga social.
        observation:
          type: string
          nullable: true
          title: Observação
          description: Observacoes sobre o check-in (max 600 caracteres).
          maxLength: 600
        active:
          type: boolean
          title: Ativo
          description: 'Status do check-in: true para ativo, false para encerrado.'
        person:
          type: integer
          title: Pessoa
          description: ID da pessoa que realizou o check-in.
        companion:
          type: integer
          nullable: true
          title: Acompanhante
