openapi: 3.0.3
info:
  title: Casa de Apoio API
  version: 1.0.0
  description: API de gerenciamento da Casa de Apoio com suporte a cadastros de pessoas,
    check-ins/check-outs, serviços domésticos de apoio (alimentação, higiene, repouso)
    e serviços profissionais de atendimento. Todos os endpoints requerem autenticação
    via token.
  license:
    name: MIT
paths:
  /api-token-auth/:
    post:
      operationId: api_token_auth_create
      tags:
      - api-token-auth
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthToken'
          application/json:
            schema:
              $ref: '#/components/schemas/AuthToken'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
          description: ''
  /api/v1/checkins/:
    get:
      operationId: checkins_list
      description: Lista check-ins com filtros de atividade, busca por nome e ordenacao
        por data de criacao.
      parameters:
      - in: query
        name: active
        schema:
          type: string
        description: Filtra por status ativo do check-in.
        examples:
          Ativos:
            value: 'true'
          Inativos:
            value: 'false'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
        description: Ordenacao por created_at. Use -created_at para descendente.
      - in: query
        name: search
        schema:
          type: string
        description: Busca por nome da pessoa principal.
        examples:
          BuscarPorNome:
            value: Joao
            summary: Buscar por nome
      tags:
      - checkins
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCheckinList'
          description: ''
        '401':
          description: Token invalido.
    post:
      operationId: checkins_create
      description: Cria um check-in. Quando reason=patient, o campo companion e obrigatorio.
      tags:
      - checkins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkin'
            examples:
              ExemploDeRequest:
                value:
                  person: 1
                  companion: 2
                  reason: patient
                  chemotherapy: true
                  radiotherapy: false
                  surgery: false
                  exams: true
                  appointment: true
                  other: false
                  ca_number: CA-001-2026
                  social_vacancy: true
                  observation: Paciente aguardando atendimento.
                  active: true
                summary: Exemplo de request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Checkin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Checkin'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkin'
              examples:
                ExemploDeResposta:
                  value:
                    id: 10
                    person: 1
                    companion: 2
                    reason: patient
                    active: true
                    person_name: Joao Silva Santos
                    companion_name: Maria Silva
                    formatted_created_at: 23/03/2026
                  summary: Exemplo de resposta
          description: ''
        '400':
          description: Erro de validacao dos dados enviados.
        '401':
          description: Token invalido.
  /api/v1/checkins/{id}/:
    get:
      operationId: checkins_retrieve
      description: Recupera os dados de um check-in por ID.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Check-in.
        required: true
      tags:
      - checkins
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkin'
          description: ''
    put:
      operationId: checkins_update
      description: Atualiza totalmente os dados de um check-in.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Check-in.
        required: true
      tags:
      - checkins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Checkin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Checkin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Checkin'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkin'
          description: ''
    patch:
      operationId: checkins_partial_update
      description: Atualiza parcialmente os dados de um check-in.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Check-in.
        required: true
      tags:
      - checkins
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCheckin'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCheckin'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCheckin'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkin'
          description: ''
    delete:
      operationId: checkins_destroy
      description: Remove um check-in existente.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Check-in.
        required: true
      tags:
      - checkins
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
