  /api/v1/people/:
    get:
      operationId: people_list
      description: Lista pessoas com suporte a busca, ordenacao e paginacao.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: ordering
        schema:
          type: string
        description: Ordenacao por name. Use -name para descendente.
        examples:
          Ascendente:
            value: name
          Descendente:
            value: -name
      - in: query
        name: search
        schema:
          type: string
        description: Busca textual por nome da pessoa.
        examples:
          BuscarPorNome:
            value: Joao
            summary: Buscar por nome
      tags:
      - people
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPersonList'
          description: ''
        '401':
          description: Token nao fornecido ou invalido.
    post:
      operationId: people_create
      description: Cria uma nova pessoa com validacoes de cadastro (CPF, CEP, telefone
        e cidade).
      tags:
      - people
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Person'
            examples:
              ExemploDeRequest:
                value:
                  name: Joao Silva Santos
                  mother_name: Maria da Silva
                  born_date: '1985-03-15'
                  gender: M
                  email: joao.silva@email.com
                  cpf: '12345678901'
                  rg: '1234567'
                  rg_ssp: SP
                  state: SP
                  address_line_1: Rua das Flores, 123
                  address_line_2: Apartamento 45
                  neighbourhood: Centro
                  city: Sao Paulo
                  postal_code: '01310100'
                  residence_type: urban
                  ddd_private_phone: '11'
                  private_phone: '33334444'
                  ddd_message_phone: '11'
                  message_phone: '999998888'
                  observation: Paciente com retorno de consulta em 7 dias.
                summary: Exemplo de request
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Person'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Person'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
          description: Pessoa criada com sucesso.
        '400':
          description: Erro de validacao dos dados enviados.
        '401':
          description: Token nao fornecido ou invalido.
  /api/v1/people/{id}/:
    get:
      operationId: people_retrieve
      description: Recupera os dados de uma pessoa pelo identificador.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Pessoa.
        required: true
      tags:
      - people
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
              examples:
                ExemploDeResposta:
                  value:
                    id: 1
                    name: Joao Silva Santos
                    formatted_born_date: 15/03/1985
                    formatted_cpf: 123.456.789-01
                    formatted_postal_code: 01310-100
                  summary: Exemplo de resposta
          description: Pessoa encontrada.
        '401':
          description: Token nao fornecido ou invalido.
        '404':
          description: Pessoa nao encontrada.
    put:
      operationId: people_update
      description: Atualiza totalmente os dados de uma pessoa.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Pessoa.
        required: true
