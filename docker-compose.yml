version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: casa_apoio_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root1234}
      MYSQL_DATABASE: ${DB_NAME:-danielledb}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${DB_PASSWORD:-root1234}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
